name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_market_test
          MYSQL_USER: campus
          MYSQL_PASSWORD: campus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: testing
      SECRET_KEY: ci-secret-0123456789abcdef0123456789
      TEST_DATABASE_URL: mysql+pymysql://campus:campus@127.0.0.1:3306/campus_market_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://campus:campus@127.0.0.1:3306/campus_market_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      RATELIMIT_STORAGE_URI: redis://127.0.0.1:6379/1
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app.py auth.py config.py extensions.py models.py routes utils seed tests
      - name: Migration check
        working-directory: backend
        run: flask --app app db upgrade
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
