services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_market
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    ports:
      - "3407:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: dev-compose-secret-0123456789abcdef
      DATABASE_URL: mysql+pymysql://campus:campus@mysql:3306/campus_market?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      CACHE_LOCAL_TTL_SECONDS: "20"
      CACHE_REDIS_TTL_SECONDS: "120"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: >
      sh -c "flask --app app db upgrade || flask --app app init-db;
             flask --app app seed-demo;
             gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 app:app"

  java-server:
    build:
      context: ./server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_market?characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: campus
      SPRING_DATASOURCE_PASSWORD: campus
      DATA_URL: http://backend:5000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SECRET_KEY: dev-compose-secret-0123456789abcdef
      JWT_ISSUER: campus-market
      JWT_AUDIENCE: campus-market-web
      CACHE_LOCAL_TTL_SECONDS: "20"
      CACHE_REDIS_TTL_SECONDS: "120"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
