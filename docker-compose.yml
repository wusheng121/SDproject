services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_market
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: dev-compose-secret-0123456789abcdef
      DATABASE_URL: mysql+pymysql://campus:campus@mysql:3306/campus_market?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      CACHE_LOCAL_TTL_SECONDS: "20"
      CACHE_REDIS_TTL_SECONDS: "120"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: >
      sh -c "flask --app app db upgrade || flask --app app init-db;
             flask --app app seed-demo;
             gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 app:app"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
