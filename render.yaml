services:
  - type: web
    name: movie-recommendation-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_SECONDS
        value: "86400"
      - key: CORS_ORIGINS
        sync: false
